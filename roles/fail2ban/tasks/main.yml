---

- name: Instalar Fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present
    update_cache: yes


- name: Crear configuracion local Fail2ban
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reiniciar Fail2ban


- name: Habilitar y arrancar Fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    enabled: yes
    state: started
